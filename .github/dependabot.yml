version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain cooldown: don't propose a release published < 7 days ago.
    cooldown:
      default-days: 7
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Supply-chain cooldown: don't propose a release published < 7 days ago.
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    ignore:
      # Held at 0.22.1: 0.25.0 removed the SessionModel API the fork's
      # model-selection feature depends on. Bump only via a migration story.
      - dependency-name: "@agentclientprotocol/sdk"
    groups:
      minor:
        update-types:
          - "minor"
          - "patch"
